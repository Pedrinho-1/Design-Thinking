<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoCampus | Login</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <main class="login-container">
    <section class="login-card">

      <div class="logo">
        <i class="fa-solid fa-car-side"></i>
        <span>UJRide</span>
      </div>

      <form id="loginForm">
        <h1>Acesse sua conta</h1>
        <p>Escolha seu perfil para entrar na plataforma.</p>

        <div class="perfil-box">
          <button type="button" class="perfil-btn ativo" data-perfil="aluno">
            <i class="fa-solid fa-user-graduate"></i> Aluno
          </button>

          <button type="button" class="perfil-btn" data-perfil="motorista">
            <i class="fa-solid fa-car"></i> Motorista
          </button>
        </div>

        <label for="email">E-mail acadêmico</label>
        <input type="email" id="email" placeholder="seu.email@universidade.edu" required>

        <label for="senha">Senha</label>
        <div class="senha-area">
          <input type="password" id="senha" placeholder="Digite sua senha" required>
          <button type="button" id="mostrarSenha">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>

        <button type="submit" class="btn-login">
          Entrar como <span id="perfilTexto">Aluno</span>
        </button>

        <p class="cadastro-link">
          Ainda não tem conta?
          <a href="#" id="abrirCadastro">Cadastre-se agora</a>
        </p>
      </form>

      <form id="formCadastro" class="oculto">
        <h1>Crie sua conta</h1>
        <p>Preencha os dados abaixo para se cadastrar.</p>

        <label for="nomeCadastro">Nome completo</label>
        <input type="text" id="nomeCadastro" placeholder="Digite seu nome completo" required>

        <label for="emailCadastro">E-mail acadêmico</label>
        <input type="email" id="emailCadastro" placeholder="seu.email@universidade.edu" required>

        <label for="senhaCadastro">Senha</label>
        <input type="password" id="senhaCadastro" placeholder="Crie uma senha" required>

        <button type="submit" class="btn-login">
          Cadastrar
        </button>

        <p class="cadastro-link">
          Já tem conta?
          <a href="#" id="voltarLogin">Entrar agora</a>
        </p>
      </form>

    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
